name: legacy-gpx-partial-migrate-once

on:
  push:
    branches:
      - data/migrate-legacy-gpx-partial
    paths:
      - .github/workflows/legacy-gpx-partial-migrate-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test partial migration code
        run: |
          python -m unittest discover -s tests -p 'test_migrate_legacy_public_gpx.py' -v
          python -m unittest discover -s tests -p 'test_ingest_attachment.py' -v

      - name: Migrate every SHA-verified GPX present in locked legacy bundle
        run: |
          python -m scripts.migrate_legacy_public_gpx

      - name: Verify partial inventory and preserve missing list
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          result_path = root / "evidence/legacy/habuAI-public/legacy_gpx_partial_migration_result.json"
          result = json.loads(result_path.read_text(encoding="utf-8"))

          assert result["expected_actual_gpx_nights"] == 13
          assert result["verified_actual_gpx_nights"] == 8
          assert result["missing_actual_gpx_nights"] == 5
          assert result["migration_status"] == "PARTIAL_SOURCE_COVERAGE"
          assert result["all_expected_sha256_matched"] is False

          missing = {row["operational_night"] for row in result["missing_expected"]}
          assert missing == {
              "2026-08-12",
              "2026-08-28",
              "2026-08-29",
              "2026-08-31",
              "2026-09-02",
          }, missing

          for record in result["files"]:
              path = root / record["raw_path"]
              assert path.is_file(), path
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == record["raw_sha256"], (
                  path, digest, record["raw_sha256"]
              )
              assert record["byte_preserved"] is True

          print("LEGACY_8_OF_13_GPX_PARTIAL_MIGRATION_PASS")
          PY

      - name: Commit verified immutable GPX and evidence to branch
        shell: bash
        run: |
          git config user.name 'habuAI-migration-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add             incoming/gpx             data/raw/gpx             evidence/raw_intake             evidence/legacy/habuAI-public/legacy_gpx_partial_migration_result.json
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'data: migrate 8 SHA-verified legacy GPX originals'
          git push origin HEAD:${GITHUB_REF_NAME}
