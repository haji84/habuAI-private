name: Codex parallel development handoff contract
on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/work/CODEX_*"
      - "scripts/check_codex_parallel_handoff.py"
      - "tests/test_codex_parallel_handoff.py"
      - ".github/workflows/codex-parallel-handoff-contract.yml"
  push:
    paths:
      - "AGENTS.md"
      - "docs/work/CODEX_*"
      - "scripts/check_codex_parallel_handoff.py"
      - "tests/test_codex_parallel_handoff.py"
      - ".github/workflows/codex-parallel-handoff-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate handoff files and science/authority gates
        run: python scripts/check_codex_parallel_handoff.py
      - name: Run fail-closed handoff regression tests
        run: python -m unittest discover -s tests -p 'test_codex_parallel_handoff.py' -v
