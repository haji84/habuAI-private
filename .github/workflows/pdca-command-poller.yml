name: habu-pdca-command-poller

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: habu-pdca-command-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime
        run: python -m pip install -r requirements-osm.txt

      - name: Find oldest unprocessed PDCA command
        id: command
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          repo=os.environ["GITHUB_REPOSITORY"]
          raw=subprocess.check_output([
              "gh","issue","list","--repo",repo,"--state","open",
              "--search","[HABU PDCA] in:title","--limit","100",
              "--json","number,title,labels,author"
          ], text=True)
          issues=json.loads(raw)
          candidates=[]
          for i in issues:
              labels={x["name"] for x in i.get("labels",[])}
              if "pdca-processing" in labels or "pdca-complete" in labels:
                  continue
              if i.get("author",{}).get("login") != repo.split("/")[0]:
                  continue
              if not i["title"].startswith("[HABU PDCA]"):
                  continue
              candidates.append(i)
          if not candidates:
              print("No pending PDCA command.")
              raise SystemExit(0)
          issue=sorted(candidates,key=lambda x:x["number"])[0]
          import re
          m=re.search(r"\b(20\d{2}-\d{2}-\d{2})\b",issue["title"])
          night=m.group(1) if m else ""
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"issue={issue['number']}\n")
              f.write(f"night={night}\n")
          PY

      - name: Mark processing
        if: steps.command.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create pdca-processing --repo "$GITHUB_REPOSITORY" --color D4C5F9 --description "PDCA command is being processed" --force
          gh issue edit "${{ steps.command.outputs.issue }}" --repo "$GITHUB_REPOSITORY" --add-label pdca-processing
          gh issue comment "${{ steps.command.outputs.issue }}" --repo "$GITHUB_REPOSITORY" --body "Habu AI PDCA processing started. Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Validate command
        id: validate
        if: steps.command.outputs.issue != ''
        env:
          NIGHT: ${{ steps.command.outputs.night }}
        run: |
          if [ -z "$NIGHT" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
          else
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run PDCA
        id: pdca
        if: steps.validate.outputs.valid == 'true'
        continue-on-error: true
        run: python scripts/run_pdca.py --night "${{ steps.command.outputs.night }}"

      - name: Read result
        id: result
        if: steps.command.outputs.issue != ''
        env:
          NIGHT: ${{ steps.command.outputs.night }}
          VALID: ${{ steps.validate.outputs.valid }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          night=os.environ.get("NIGHT","")
          if os.environ.get("VALID") != "true":
              status="FAIL"; reason="Issue title must contain YYYY-MM-DD"
          else:
              p=Path("reports")/"pdca"/night/"pdca_result.json"
              if not p.exists():
                  status="FAIL"; reason="pdca_result.json was not produced"
              else:
                  data=json.loads(p.read_text(encoding="utf-8"))
                  status=data.get("overall_status","FAIL")
                  bad=[s for s in data.get("stages",[]) if s.get("status") in {"BLOCKED","FAIL"}]
                  reason="; ".join(f"{s.get('name')}: {s.get('reason','')}" for s in bad[:5])
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"status={status}\n")
              f.write("reason<<EOF\n"+reason+"\nEOF\n")
          PY

      - name: Upload artifacts
        if: steps.command.outputs.issue != '' && steps.validate.outputs.valid == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pdca-${{ steps.command.outputs.night }}-${{ github.run_id }}
          path: reports/pdca/${{ steps.command.outputs.night }}/
          if-no-files-found: warn

      - name: Publish changed report
        id: publish
        if: steps.result.outputs.status == 'PASS' || steps.result.outputs.status == 'PARTIAL'
        env:
          NIGHT: ${{ steps.command.outputs.night }}
        run: |
          BRANCH="pdca/report-${NIGHT}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "reports/pdca/$NIGHT"
          if git diff --cached --quiet; then
            echo "report_branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "pdca: record $NIGHT evaluation"
          git push origin "$BRANCH"
          echo "report_branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open report PR
        id: report_pr
        if: steps.publish.outputs.report_branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHT: ${{ steps.command.outputs.night }}
          REPORT_BRANCH: ${{ steps.publish.outputs.report_branch }}
          ISSUE_NUMBER: ${{ steps.command.outputs.issue }}
        run: |
          URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$REPORT_BRANCH" \
            --title "PDCA report: $NIGHT" \
            --body "Generated automatically from PDCA command issue #$ISSUE_NUMBER. Report artifacts only.")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Return result and finish command
        if: steps.command.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.command.outputs.issue }}
          NIGHT: ${{ steps.command.outputs.night }}
          STATUS: ${{ steps.result.outputs.status }}
          REASON: ${{ steps.result.outputs.reason }}
          PR_URL: ${{ steps.report_pr.outputs.url }}
        run: |
          gh label create pdca-complete --repo "$GITHUB_REPOSITORY" --color 0E8A16 --description "PDCA command completed" --force
          {
            echo "Habu AI PDCA: **${STATUS:-FAIL}**"
            [ -n "$NIGHT" ] && echo "- operational night: $NIGHT"
            [ -n "$REASON" ] && echo "- blocker/failure: $REASON"
            [ -n "$PR_URL" ] && echo "- report PR: $PR_URL"
            echo "- workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/result.md
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label pdca-processing --add-label pdca-complete
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
