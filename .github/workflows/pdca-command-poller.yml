name: habu-pdca-command-poller

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.command.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find oldest unfinished authorized command
        id: command
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pdca_bridge.py discover
      - name: Retain discovery receipt diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdca-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/bridge/discovery.json
          if-no-files-found: warn
  execute:
    needs: discover
    if: needs.discover.outputs.issue != ''
    uses: ./.github/workflows/pdca-command.yml
    with:
      issue_number: ${{ fromJSON(needs.discover.outputs.issue) }}
