name: Verify Oct24 original user GPX exact bytes
on:
  pull_request:
    paths:
      - "incoming/gpx/**"
      - "data/raw/gpx/**"
      - "evidence/recovered_sources/2026-10-24-owner-gpx-intake-source-receipt.json"
      - "scripts/verify_oct24_source_intake.py"
      - "tests/test_oct24_original_gpx_intake.py"
      - ".github/workflows/verify-oct24-gpx-original-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpx-original:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify two exact GPX SHA256 hashes, original points and gap preservation
        run: python scripts/verify_oct24_source_intake.py
      - name: Block truncated, substituted or re-ordered GPX shards
        run: python -m unittest discover -s tests -p test_oct24_original_gpx_intake.py -v
