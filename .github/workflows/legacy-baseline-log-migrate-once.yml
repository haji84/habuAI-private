name: legacy-baseline-log-migrate-once
on:
  push:
    branches: [data/migrate-legacy-baseline-log]
    paths:
      - .github/workflows/legacy-baseline-log-migrate-once.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_migrate_legacy_baseline_log.py' -v
      - run: python -m scripts.migrate_legacy_baseline_log
      - name: Reparse canonical captures with 07:00 boundary
        run: |
          python -m unittest discover -s tests -p 'test_normalize_legacy_baseline_captures.py' -v
          python -m scripts.normalize_legacy_baseline_captures
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/legacy/habuAI-public/baseline_capture_reparse_summary.json")
          s=json.loads(p.read_text(encoding="utf-8"))
          assert s["capture_events"] == 39, s
          assert s["capture_individuals"] == 40, s
          assert s["coordinate_complete_events"] == 39, s
          print("LEGACY_CAPTURE_REPARSE_39_EVENTS_40_INDIVIDUALS_PASS")
          PY

      - name: Verify and commit
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("data/raw/habu_logs/baseline_through_2026-08-27.txt")
          assert p.is_file()
          assert p.stat().st_size == 93597
          assert hashlib.sha256(p.read_bytes()).hexdigest() == "3326081068714144bbb1c9654edd58d56bd92ad0c238fde88e991fa1c4e2fcc3"
          print("LEGACY_BASELINE_LOG_MIGRATION_PASS")
          PY
          git config user.name 'habuAI-migration-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add incoming/habu_log data/raw/habu_logs evidence/raw_intake data/processed/capture_events data/processed/individuals evidence/legacy/habuAI-public/baseline_capture_reparse_summary.json
          git commit -m 'data: migrate byte-identical legacy baseline log'
          git push origin HEAD:${GITHUB_REF_NAME}
