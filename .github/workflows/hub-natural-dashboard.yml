name: HUB NATURAL dashboard

on:
  # Run a new private aggregate build after every completed PDCA Actions run,
  # including scientifically BLOCKED runs. This does NOT infer capture events
  # from an untrusted Issue or mark a failed PDCA as scientifically PASS.
  workflow_run:
    workflows: ["habu-pdca-command"]
    types: [completed]
  pull_request:
    paths:
      - dashboard/**
      - scripts/build_capture_dashboard.py
      - tests/test_capture_dashboard.py
      - tests/test_capture_dashboard_frontend.py
      - data/raw/habu_logs/**
      - data/processed/individuals/**
      - data/reconstructions/habu_captures/*-owner-chat-dashboard-intake.json
      - .github/workflows/hub-natural-dashboard.yml
  push:
    branches: [main]
    paths:
      - dashboard/**
      - scripts/build_capture_dashboard.py
      - data/raw/habu_logs/**
      - data/processed/individuals/**
      - data/reconstructions/habu_captures/*-owner-chat-dashboard-intake.json
      - .github/workflows/hub-natural-dashboard.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-natural-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    # workflow_run input is metadata only. Always checkout trusted main and do
    # not download or execute artifacts from the preceding PDCA run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Run dashboard regression tests
        run: python -m unittest discover -s tests -p test_capture_dashboard.py -v
      - name: Test embedded April snapshot and browser JavaScript
        run: python -m unittest discover -s tests -p test_capture_dashboard_frontend.py -v
      - name: Verify owner-chat PDCA and dashboard synchronization safety
        run: python -m unittest discover -s tests -p test_dashboard_pdca_sync.py -v
      - name: Test Cloudflare Access gate
        run: python -m unittest discover -s tests -p test_verify_pages_access.py -v
      - name: Test bootstrap preconditions
        run: python -m unittest discover -s tests -p test_pages_bootstrap.py -v
      - name: Build aggregate-only dashboard
        run: python scripts/build_capture_dashboard.py
      - name: Display capture vs PDCA source/readiness independently
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('dashboard/dist/data/capture_summary.json').read_text(encoding='utf-8'))
          metric=data.get("owner_chat_statistics",{})
          print(json.dumps({
              "dashboard_captures_asof":data["asof"],
              "dashboard_cumulative":data["total"],
              "source_reconciled_report_nights":metric.get("report_nights",0),
              "fauna_sighting_events_only_reported_in_new_nights":metric.get("fauna_sighting_events",0),
              "habu_roadkills_not_counted_as_capture":metric.get("habu_roadkill_events",0),
              "pdca_science_status_per_night":metric.get("pdca_status_by_night",[]),
              "formal_training_negative_from_review":metric.get("formal_training_negative_from_review",0),
              "source_intake_rule":"New PDCA with unregistered logs cannot create capture counts"
          },ensure_ascii=False))
          PY
      - name: Reject detailed location information in export
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('dashboard/dist/data/capture_summary.json').read_text(encoding='utf-8'))
          assert data['privacy'] == 'AGGREGATE_ONLY_NO_COORDINATES'
          assert data['total'] == sum(m['n'] for m in data['months'])
          assert data['total'] == sum(n['count'] for n in data['nights']) + sum(u['count'] for u in data.get('undated_captures', []))
          for n in data['nights']:
              assert not any(k in n for k in ('lat','lon','latitude','longitude','address','place','person','name','token','email'))
          for u in data.get('undated_captures', []):
              assert not any(k in u for k in ('lat','lon','latitude','longitude','address','place','person','name','token','email'))
          print('Aggregate-only verification PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hub-natural-private-dashboard
          path: dashboard/dist/
          retention-days: 7

  deploy-protected:
    needs: verify-build
    if: github.event_name != 'pull_request' && vars.HUB_NATURAL_ACCESS_VERIFIED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Access-protected production and preview before deployment
        env:
          PRODUCTION_URL: ${{ vars.HUB_NATURAL_PRODUCTION_URL }}
          PREVIEW_URL: ${{ vars.HUB_NATURAL_PREVIEW_URL }}
        run: |
          python scripts/verify_pages_access.py --production "$PRODUCTION_URL" --preview "$PREVIEW_URL"
      - uses: actions/download-artifact@v4
        with:
          name: hub-natural-private-dashboard
          path: dashboard/dist
      - name: Deploy only to verified Access-protected Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dashboard/dist --project-name=hub-natural-private --branch=main
