name: HUB NATURAL dashboard

on:
  pull_request:
    paths:
      - dashboard/**
      - scripts/build_capture_dashboard.py
      - tests/test_capture_dashboard.py
      - tests/test_capture_dashboard_frontend.py
      - tests/test_capture_dashboard_effort.py
      - tests/test_capture_dashboard_automation.py
      - data/raw/habu_logs/**
      - data/raw/habu_effort/**
      - data/raw/habu_owner_nights/**
      - data/raw/habu_owner_amendments/**
      - data/processed/individuals/**
      - .github/workflows/hub-natural-dashboard.yml
  push:
    branches: [main]
    paths:
      - dashboard/**
      - scripts/build_capture_dashboard.py
      - data/raw/habu_logs/**
      - data/raw/habu_effort/**
      - data/raw/habu_owner_nights/**
      - data/raw/habu_owner_amendments/**
      - data/processed/individuals/**
      - .github/workflows/hub-natural-dashboard.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-natural-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Run dashboard regression tests
        run: python -m unittest discover -s tests -p test_capture_dashboard.py -v
      - name: Test confirmed capture and zero-effort integration
        run: python -m unittest discover -s tests -p test_capture_dashboard_effort.py -v
      - name: Test automatic nightly updates and historic corrections
        run: python -m unittest discover -s tests -p test_capture_dashboard_automation.py -v
      - name: Test mixed-date log import UI and safe batch importer
        run: python -m unittest discover -s tests -p test_log_intake_ui.py -v
      - name: Test smartphone GPS field recording and privacy
        run: python -m unittest discover -s tests -p test_field_recording.py -v
      - name: Test embedded April snapshot and browser JavaScript
        run: python -m unittest discover -s tests -p test_capture_dashboard_frontend.py -v
      - name: Test Cloudflare Access gate
        run: python -m unittest discover -s tests -p test_verify_pages_access.py -v
      - name: Test bootstrap preconditions
        run: python -m unittest discover -s tests -p test_pages_bootstrap.py -v
      - name: Build aggregate-only dashboard
        run: python scripts/build_capture_dashboard.py
      - name: Reject detailed location information in export
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('dashboard/dist/data/capture_summary.json').read_text(encoding='utf-8'))
          assert data['privacy'] == 'AGGREGATE_ONLY_NO_COORDINATES'
          assert data['total'] == sum(m['n'] for m in data['months'])
          assert data['total'] == sum(n['count'] for n in data['nights']) + sum(u['count'] for u in data.get('undated_captures', []))
          for n in data['nights']:
              assert not any(k in n for k in ('lat','lon','latitude','longitude','address','place','person','name','token','email'))
          for u in data.get('undated_captures', []):
              assert not any(k in u for k in ('lat','lon','latitude','longitude','address','place','person','name','token','email'))
          print('Aggregate-only verification PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hub-natural-private-dashboard
          path: dashboard/dist/
          retention-days: 7

  deploy-protected:
    needs: verify-build
    if: github.event_name != 'pull_request' && vars.HUB_NATURAL_ACCESS_VERIFIED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Access-protected production and preview before deployment
        env:
          PRODUCTION_URL: ${{ vars.HUB_NATURAL_PRODUCTION_URL }}
          PREVIEW_URL: ${{ vars.HUB_NATURAL_PREVIEW_URL }}
        run: |
          python scripts/verify_pages_access.py --production "$PRODUCTION_URL" --preview "$PREVIEW_URL"
      - uses: actions/download-artifact@v4
        with:
          name: hub-natural-private-dashboard
          path: dashboard/dist
      - name: Deploy only to verified Access-protected Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dashboard/dist --project-name=hub-natural-private --branch=main
