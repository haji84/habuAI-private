name: habu-pdca-command

on:
  issues:
    types: [opened]
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  executor:
    if: inputs.issue_number > 0 || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[HABU PDCA]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: habu-pdca-executor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing scientific runtime
        run: python -m pip install -r requirements-analysis.txt
      - name: Execute or recover authorized command
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          BRIDGE_ATTEMPT: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python scripts/pdca_bridge.py execute
      - name: Upload attempt diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdca-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/bridge/
          if-no-files-found: warn
