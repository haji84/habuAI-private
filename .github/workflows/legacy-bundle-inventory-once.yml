name: legacy-bundle-inventory-once
on:
  push:
    branches: [audit/legacy-bundle-inventory]
    paths:
      - .github/workflows/legacy-bundle-inventory-once.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_legacy_bundle_inventory.py' -v
      - run: python -m scripts.audit_legacy_bundle_inventory
      - name: Commit inventory
        run: |
          git config user.name 'habuAI-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add evidence/legacy/habuAI-public/initial_bundle_inventory.json
          git commit -m 'evidence: inventory locked legacy raw bundle'
          git push origin HEAD:${GITHUB_REF_NAME}
