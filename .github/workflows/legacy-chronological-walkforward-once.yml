name: legacy-chronological-walkforward-once

on:
  push:
    branches:
      - feat/legacy-chronological-walkforward
    paths:
      - .github/workflows/legacy-chronological-walkforward-once.yml
      - scripts/legacy_chronological_walkforward.py
      - tests/test_legacy_chronological_walkforward.py
      - requirements-analysis.txt

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis runtime
        run: python -m pip install -r requirements-analysis.txt

      - name: Test future-leakage guards
        run: |
          python -m unittest discover -s tests -p 'test_legacy_chronological_walkforward.py' -v

      - name: Run chronological legacy evaluation
        run: |
          python -m scripts.legacy_chronological_walkforward

      - name: Verify evaluation contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("reports/legacy_chronological_walkforward.json")
          report = json.loads(p.read_text(encoding="utf-8"))

          assert report["evaluation_class"] == "LEGACY_10M_CHRONOLOGICAL_DIAGNOSTIC"
          assert report["official_100m_10min_kpi"] is False
          assert report["future_leakage_guard"] is True
          assert report["source"]["integrity"]["size_match"] is True
          assert report["source"]["integrity"]["blob_match"] is True
          assert report["available_nights"] == [
              "2026-08-13",
              "2026-08-15",
              "2026-08-17",
              "2026-08-19",
              "2026-08-21",
              "2026-08-23",
              "2026-08-24",
              "2026-08-27",
          ]
          assert report["summary"]["completed_folds"] == 6
          for fold in report["folds"]:
              assert all(n < fold["test_night"] for n in fold["train_nights"])
              assert fold["future_nights_used"] == []

          print("LEGACY_CHRONOLOGICAL_WALKFORWARD_PASS")
          PY

      - name: Commit diagnostic report to branch
        shell: bash
        run: |
          git config user.name 'habuAI-evaluation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/legacy_chronological_walkforward.json
          if git diff --cached --quiet; then
            echo 'No report changes to commit.'
            exit 0
          fi
          git commit -m 'eval: add chronological legacy walk-forward report'
          git push origin HEAD:${GITHUB_REF_NAME}
